<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#10151F"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAECEF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#EAECEF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#EAECEF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#EAECEF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1.3 0" to="1.3 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1B2230" stroke-width="1"/>
    </pattern>

    <radialGradient id="fade" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0E14" stop-opacity="0.9"/>
    </radialGradient>

    <clipPath id="revealClip">
      <rect x="0" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="620" begin="0.2s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>

    <mask id="scanMask">
      <rect x="0" y="0" width="1200" height="300" fill="black"/>
      <rect x="0" y="0" width="90" height="300" fill="white" opacity="0.5">
        <animate attributeName="x" from="-90" to="1200" dur="5s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="#7C5CFF" mask="url(#scanMask)" opacity="0.05"/>
  <rect width="1200" height="300" fill="url(#fade)"/>

  <line x1="0" y1="299" x2="1200" y2="299" stroke="url(#accent)" stroke-width="2"/>

  <!-- circuit nodes, pulsing -->
  <g>
    <line x1="1080" y1="70" x2="1120" y2="130" stroke="#2A3244" stroke-width="1"/>
    <line x1="1120" y1="130" x2="1050" y2="190" stroke="#2A3244" stroke-width="1"/>
    <line x1="1050" y1="190" x2="1000" y2="240" stroke="#2A3244" stroke-width="1"/>
    <line x1="1150" y1="60" x2="1080" y2="70" stroke="#2A3244" stroke-width="1"/>

    <circle cx="1080" cy="70" r="1.5" fill="#00F7FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="130" r="1.5" fill="#7C5CFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="190" r="1.5" fill="#00F7FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="60" r="1.5" fill="#7C5CFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="240" r="1.5" fill="#00F7FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- terminal preamble, typed in fast -->
  <text x="70" y="95" font-family="'JetBrains Mono','Fira Code',monospace" font-size="17" fill="#5B6478" opacity="0">
    apex-logic@github
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="70" y="118" font-family="'JetBrains Mono','Fira Code',monospace" font-size="17" fill="#3A4256" opacity="0">
    ~$ whoami
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- main title, reveals via clip then shimmers -->
  <g clip-path="url(#revealClip)">
    <text x="68" y="185" font-family="'JetBrains Mono','Fira Code',monospace" font-size="56" font-weight="700" fill="#EAECEF">apex<tspan fill="url(#accent)">-logic</tspan></text>
    <text x="68" y="185" font-family="'JetBrains Mono','Fira Code',monospace" font-size="56" font-weight="700" fill="url(#shimmer)">apex-logic</text>
  </g>

  <!-- blinking cursor -->
  <rect x="612" y="147" width="14" height="46" fill="#00F7FF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.13;0.63;0.64;1" dur="1.1s" begin="1.3s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle, fades in after title -->
  <text x="70" y="222" font-family="'Fira Code',monospace" font-size="18" fill="#8B93A7" opacity="0">
    Software Developer &#183; Java &#183; C++ &#183; Python &#183; PHP
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
  </text>

  <rect x="68" y="245" width="0" height="1" fill="#1B2230">
    <animate attributeName="width" from="0" to="480" begin="1.7s" dur="0.5s" fill="freeze"/>
  </rect>
  <text x="70" y="270" font-family="'Fira Code',monospace" font-size="13" fill="#4A5268" letter-spacing="2" opacity="0">
    BUILDING &#8226; DEBUGGING &#8226; SHIPPING
    <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.6s" fill="freeze"/>
  </text>
</svg>
